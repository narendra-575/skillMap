<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SkillMap - Student Profile</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .profile-page {
            min-height: calc(100vh - 75px);
            padding: 60px 8%;
            display: flex;
            justify-content: center;
        }

        .profile-container {
            background: white;
            width: 100%;
            max-width: 800px;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.08);
        }

        .profile-container h1 {
            margin-bottom: 10px;
        }

        .profile-container .subtitle {
            color: #667085;
            margin-bottom: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .form-group input,
        .form-group select {
            padding: 12px;
            border: 1px solid #d0d5dd;
            border-radius: 8px;
            font-size: 14px;
        }

        .skills-section {
            margin-top: 30px;
        }

        .skills-section h3 {
            margin-bottom: 15px;
        }

        .skill-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .analyze-btn {
            margin-top: 30px;
            width: 100%;
            padding: 15px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .analyze-btn:hover {
            background: #4338ca;
        }

        @media (max-width: 600px) {
            .form-grid,
            .skill-inputs {
                grid-template-columns: 1fr;
            }

            .profile-container {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <div class="logo">SkillMap</div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="index.html#features">Features</a>
            <a href="index.html#about">About</a>
        </div>

        <button class="login-btn">
            Login
        </button>
    </nav>


    <section class="profile-page">

        <div class="profile-container">

            <h1>Student Profile</h1>

            <p class="subtitle">
                Enter your details and current skills to analyze your career readiness.
            </p>


            <div class="form-grid">

                <div class="form-group">
                    <label>Student Name</label>
                    <input type="text" placeholder="Enter your name">
                </div>

                <div class="form-group">
                    <label>College</label>
                    <input type="text" placeholder="Enter your college">
                </div>

                <div class="form-group">
                    <label>Branch</label>
                    <input type="text" placeholder="e.g. AIML">
                </div>

                <div class="form-group">
                    <label>Year</label>

                    <select>
                        <option>1st Year</option>
                        <option selected>2nd Year</option>
                        <option>3rd Year</option>
                        <option>4th Year</option>
                    </select>
                </div>

            </div>


            <div class="skills-section">

                <h3>Your Current Skills</h3>

                <div class="skill-inputs">

                    <div class="form-group">
                        <label>C++ (%)</label>
                        <input type="number" value="70">
                    </div>

                    <div class="form-group">
                        <label>Python (%)</label>
                        <input type="number" value="45">
                    </div>

                    <div class="form-group">
                        <label>DSA (%)</label>
                        <input type="number" value="30">
                    </div>

                    <div class="form-group">
                        <label>SQL (%)</label>
                        <input type="number" value="50">
                    </div>

                </div>

            </div>


            <div class="skills-section">

                <h3>Target Career Role</h3>

                <div class="form-group">

                    <select>
                        <option>AI/ML Engineer</option>
                        <option>Backend Developer</option>
                        <option>Data Analyst</option>
                        <option>Frontend Developer</option>
                    </select>

                </div>

            </div>


            <button class="analyze-btn" onclick="analyzeSkills()">
                Analyze My Skills →
            </button>

        </div>

    </section>


    <script>
        function analyzeSkills() {
            window.location.href = "analysis.html";
        }
    </script>

</body>
</html>
